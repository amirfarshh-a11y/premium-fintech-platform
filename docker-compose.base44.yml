name: premium-fintech

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum_local_dev
      POSTGRES_DB: aurum
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 5s
      timeout: 3s
      retries: 15
    labels:
      base44.kind: infra

  api:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app/server
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --prefer-offline
        exec node --watch index.js
    volumes:
      - "${BASE44_PROJECT_ROOT:-.}:/app"
      - api-node-modules:/app/server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgres://aurum:aurum_local_dev@db:5432/aurum
      - BASE44_PREVIEW_MODE
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    labels:
      base44.project: Aurum API
      base44.kind: api
      base44.port: "4000"

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --prefer-offline
        exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - "${BASE44_PROJECT_ROOT:-.}:/app"
      - web-node-modules:/app/node_modules
      - vite-cache:/app/node_modules/.vite
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - VITE_API_PROXY_TARGET=http://api:4000
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 4 -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    labels:
      base44.project: Aurum Web
      base44.kind: web
      base44.port: "3000"

volumes:
  db-data:
  api-node-modules:
  web-node-modules:
  vite-cache:
